name: just_start_app
description: "Just Start - إبدأ الآن | تطبيق الخدمات الرقمية والأكاديمية والدورات التدريبية"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/img/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/img/logo.png"

flutter_native_splash:
  color: "#0F172A"
  color_dark: "#0B0F19"
  image: "assets/img/logo.png"
  android_12:
    image: "assets/img/logo.png"
    icon_background_color: "#0F172A"
    icon_background_color_dark: "#0B0F19"

flutter:
  uses-material-design: true
  assets:
    - assets/img/
    - assets/img/courses/
    - assets/img/icons/
    - assets/img/posts/
    - assets/img/services/
